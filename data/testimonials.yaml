participants:
  - key: milos-vystrcil
    name: Miloš Vystrčil
    role: "předseda Senátu Parlamentu ČR"
    text: "Těší mě, že na půdě Senátu budou ke stovkám svých vrstevníků hovořit aktivní mladí talentovaní středoškoláci a vysokoškoláci a vyprávět jim o cestách vědeckého poznání."
    img: true

  - key: marek-zenisek
    name: "Marek Ženíšek"
    role: "ministr pro vědu, výzkum a inovace"
    text: "Je to strašně důležitá akce právě z toho ohledu, že je nutno propojovat mladé i s tou vědou. A pro mě je to pozitivní, protože uspěje pouze ten, kdo je připraven"
    img: true

  - key: martin-kupka
    name: Martin Kupka
    role: "ministr dopravy"
    text: "Zvaž vědu! je parádní aktivita a je jasné, že věda je dobrodružství a že věda se prostě týká mladých lidí."
    img: true
  
  - key: simon-klinga
    name: "Simon Klinga"
    role: "Forbes 30 pod 30 2025"
    text: "Je potřeba studentům ukázat, že vědci mohou být ty rockstars, ke kterým lidé mohou vlastně vzhlížet. A že to mohou být i oni. A proto podle mě akce jako Zvaž vědu! jsou hrozně super."
    img: true

  - key: miroslav-lavicka
    name: Miroslav Lávička
    role: "rektor Západočeské univerzity"
    text: "Tohle je naprosto skvělá záležitost. Zejména jsem rád, že si to pořádají sami středoškoláci."
    img: true

  - key: jiri-dusek
    name: Jiří Dušek
    role: "senátor a ředitel Hvězdárny a planetária Brno"
    text: "Zvaž vědu! je podivuhodné a velmi chvályhodné hnutí středoškoláků, kteří jiným středoškolákům vykládají o tom, jak skvělé je být vědcem nebo špičkovým technikem..."
    img: true

orgs:
  - key: vlada-cr
    name: "Vláda ČR"
    text: "V pátek 15. listopadu proběhl na Fakultě aplikovaných věd Západočeské univerzity v Plzni druhý ročník unikátní akce Zvaž vědu! Středoškoláci středoškolákům představili ty nejzajímavější oblasti výzkumu, které hýbou současným světem. Na FAV ZČU dorazilo více než 300 středoškoláků ze 17 různých škol napříč celým Plzeňským krajem, od Plas přes Plzeň až po Domažlice."
    link: https://vlada.gov.cz/cz/vlada/clenove-vlady/pri-uradu-vlady/marek_zenisek/v-mediich/plzenoviny-akce-zvaz-vedu!-prilakala-vice-nez-300-stredoskolaku-217381/
    date: 2024-11-30

  - key: novinkycz
    name: "Novinky.cz"
    text: "Akce Zvaž vědu!, kterou organizují studenti pro studenty, se uskuteční v pondělí 9. června v Senátu Parlamentu České republiky na Valdštejnském náměstí v Praze 1. Účastníci se mohou těšit na přednášky dvanácti inspirativních studentů z celého Česka. Nabídnou příběhy plné informací o vědě, technice a o zajímavých příležitostech. "
    link: "https://www.novinky.cz/clanek/veda-skoly-budoucnost-zajistena-mladi-vedci-dokazuji-ze-cesko-ma-dobre-naslapnuto-40523184"
    date: 2025-06-08

  - key: denik
    name: "Deník"
    text: "Jsou ještě náctiletí, přesto již spolupracují s vědeckými špičkami na ambiciózních projektech, případně vytvořili aplikaci, kterou používají tisíce lidí. Středoškolští studenti z hnutí Zvaž vědu! nyní chtějí motivovat další děti a mladistvé k zájmu o vědecké obory. Někteří z nich Deník nechali nahlédnout za oponu, aby ukázali, jaké je se věnovat vědě v mladém věku."
    link: "https://www.denik.cz/veda-a-technika/stredoskolaci-cesko-zvaz-vedu-projekty.html"
    date: 2025-06-07

  - key: wired
    name: "WIRED"
    text: "Zvaž vědu! je nyní už celostátní iniciativa, respektive hnutí středoškolských studentů, které se snaží ukazovat dalším středoškolákům a středoškolačkám, proč je věda zajímavá a proč by pro ně mohla být dobrým oborem do budoucna. Naše hlavní aktivity jsou v konferencích – za pár dní nás čeká první velká akce v Praze – přímo v Senátu."
    link: "https://www.wired.cz/clanky/sestnactilety-jan-herzig-miluje-vesmir-a-pro-vedu-motivuje-i-dalsi-stredoskolaky"
    date: 2025-06-05
    
  - key: zcuinfo
    name: "Západočeská univerzita v Plzni"
    text: "Téměř tři sta studentů a studentek středních škol z celého Plzeňského kraje si přijelo poslechnout přednášky z technicko-přírodovědných oborů. Organizátoři akce z řad středoškoláků nabídli celkem dvanáct přednášek z oblasti AI, kvantových technologií, astronomie, fyziky nebo třeba matematiky. ."
    link: "https://info.zcu.cz/Stredoskolaci-sobe--Na-FAV-se-konal-maraton-prednasek-Zvaz-vedu!/clanek.jsp?id=5942"
    date: 2024-11-21
    
  - key: plzensky-kraj
    name: "Plzeňský kraj"
    text: "Studenti se sami snaží nadchnout své vrstevníky a ukázat, že věda umí být krásná, zajímavá a že stojí za to se jí věnovat. Právě proto se v pátek 15. listopadu za podpory Plzeňského kraje konal 2. ročník akce Zvaž vědu."
    link: "https://www.plzensky-kraj.cz/studenti-motivovali-akci-zvaz-vedu"
    date: 2025-11-15
    
  - key: astrocz
    name: "Česká astronomická společnost"
    text: "10 přednášek od 12 inspirativních studentů z celého Česka. 300 minut jedinečných příběhů plných informací o vědě, technice a zajímavých příležitostech. Více než 100 nadšených středoškoláků v publiku. Nespočet zajímavých setkání. To jsou jen některá z čísel charakterizujících akci Zvaž vědu!"
    link: "https://www.astro.cz/clanky/ostatni/budoucnost-zajistena-mladi-vedci-dokazuji-ze-cesko-ma-dobre-naslapnuto.html"
    date: 2025-05-26
    
  - key: rozhlas
    name: "Český rozhlas"
    text: "„Zajímavý je také projekt Zvaž vědu!, který bude probíhat v Senátu. Má vtáhnout středoškoláky do vědy,“ doplňuje."
    link: "https://plus.rozhlas.cz/az-na-obeznou-drahu-stredoskolaci-umi-dotahnout-veci-do-konce-ukazou-je-na-9481138"
    date: 2025-05-26

  - key: prahatv
    name: "Praha TV"
    text: "Zvaž vědu je studentská iniciativa, která chce přiblížit vědu široké veřejnosti i svým vrstevníkům. Na letošní třetí ročník, poprvé pořádaný v Praze, dorazilo 150 zájemců a zaplnili sál Senátu Parlamentu ČR. Akce tak ukázala, že věda nemusí být nedostupná – důkazem je i gymnazista Pavel Hoda, člen Mensy a nadšený programátor, který společně s ostatními dokazuje, že věda je skutečně pro každého."
    link: "https://prahatv.eu/zprava/budouci-vedci-ovladli-senat-akce-zvaz-vedu-motivuje-studenty-rozvijet-se-i-mimo-skolni-lavice/"
    date: 2025-06-10

  - key: za-plzni
    name: "Za Plzní"
    text: "Svým úspěchem a dosahem je Zvaž vědu! první akcí svého druhu, která se kdy v Česku uskutečnila. Téměř 300 studentů se zájmem o přírodní vědy se sešlo na jednom místě, aby jim jejich vrstevníci mohli ukázat, kolik úžasných příležitostí nyní mají k rozvíjení svého zájmu. A to vše za podpory těch nejvýznamnějších institucí z celého regionu."
    link: "https://zaplzni.cz/prvni-akce-sveho-druhu-u-nas-300-studentu-v-plzni-zvazilo-vedu/"
    date: 2023-12-19

  - key: astrocz
    name: "Česká astronomická společnost"
    text: "Projekt, který nemá obdoby. Nemají za sebou ještě ani maturitu, ale uskutečnili akci, kterou český Senát nepamatuje. V Praze se v pondělí 9. června poprvé odehrála akce Zvaž vědu! a horní komoru parlamentu zaplnily davy nadšených studentů. 150 středoškoláků z 58 škol ve 12 krajích si přišlo poslechnout 10 jedinečných přednášek od svých vrstevníků, kteří neváhali a už na střední se s úspěchem pustili do posouvání hranic lidského poznání."
    link: "https://www.astro.cz/clanky/ostatni/senat-plny-jako-nikdy-predtim-stredoskolaci-ukazali-ze-veda-ma-smysl.html"
    date: 2025-06-16

name: Format Typography (Czech Prepositions)

on:
  push:
    branches:
      - modernizace-2025
    paths:
      - 'content/**.md'
      - 'content/**.markdown'
      - 'data/**.yaml'
      - 'data/**.yml'
  workflow_dispatch:

jobs:
  format-typography:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format Czech prepositions and conjunctions
        run: python scripts/format_typography.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add content/ data/
          git diff --staged --quiet || git commit -m "Auto: Fix orphan Czech prepositions and conjunctions"
          git push

name: Process Images (Sanitize, WebP, Resize)

on:
  push:
    branches:
      - modernizace-2025 # Or your main content branch
    paths:
      - 'static/**.jpg'
      - 'static/**.png'
      - 'static/**.JPG'
      - 'static/**.jpeg'
      - 'static/**.webp'
      - 'content/**.jpg'
      - 'content/**.png'
      - 'content/**.webp'
  workflow_dispatch:

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write access to the repository contents
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: pip install Pillow

      - name: Sanitize filenames (replace spaces, keep diacritics)
        run: python scripts/sanitize_filenames.py

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert images to WebP
        run: |
          find . -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.jpeg" \) -print0 | while IFS= read -r -d $'\0' file; do
            webp_file="${file%.*}.webp"
            
            # Convert if WebP doesn't exist OR if original is newer
            if [ ! -f "$webp_file" ] || [ "$file" -nt "$webp_file" ]; then
              echo "Converting $file to $webp_file"
              
              # Execute conversion; if successful, delete the source file
              if cwebp "$file" -o "$webp_file" -q 80; then
                echo "Conversion successful. Removing original: $file"
                rm "$file"
              else
                echo "Warning: Failed to convert $file. Keeping original."
              fi
            else
              # If the WebP is already up to date, just clean up the lingering original
              echo "WebP is already up to date. Removing original: $file"
              rm "$file"
            fi
          done

      - name: Generate responsive WebP variants (-sm, -md, -hd)
        run: python scripts/optimize_images.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage all modifications (renames, deletions, new files, updated content)
          git add -A
          git diff --staged --quiet || git commit -m "Auto: Sanitize names, convert to WebP, and generate responsive variants"
          git push

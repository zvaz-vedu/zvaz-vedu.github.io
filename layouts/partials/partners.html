<section class="layout-container" id="partners">
    <div class="layout-content">
        <strong style="font-size: 1.777rem;">Partneři</strong>
        <div class="partner-body">
            {{range .Params.partners}}
                {{$partnerLink := replace . "-" "."}}
                {{$partnerLink := replace $partnerLink ".." "-"}}
                <a href="https://www.{{$partnerLink}}/" target="_blank">
                    <img
                        class="partner-logo-img" {{/* Added a class for JS targeting */}}
                        data-partner-name="{{.}}" {{/* Store the base name here! */}}
                        src="/media/imgs/partners/{{.}}.png" {{/* Default source generated by Hugo */}}
                        style="{{ if or (eq . "senat-cz") (eq . "hvezdarna-cz") (eq . "eserocz-cz") }}height: 48px;{{ else }}height: 44px;{{ end }} width: auto;"
                    >
                </a>
            {{end}}
        </div>
    </div>
</section>

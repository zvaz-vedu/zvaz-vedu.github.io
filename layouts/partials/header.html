<header class="layout-container">
    <div class="layout-content">
        <div class="header-body">
            <h1>{{.Params.headerTitle}}</h1>
            <p class="header-text">
                {{ if .Params.location }}
                    <span class="header-meta-item">
                        <i class="fa-solid fa-location-dot"></i> {{ .Params.location }}&nbsp;
                    </span>
                {{ end }}
                        
                {{ if .Params.date }}
                    <span class="header-meta-item">
                        <i class="fa-regular fa-calendar"></i> 
                        {{ (time .Params.date).Format "2. 1. 2006" }}
                    </span>
                {{ end }}
            </p>
        </div>
        <img src="{{ .Site.BaseURL }}{{.Params.headerImg}}">
    </div>
</header>

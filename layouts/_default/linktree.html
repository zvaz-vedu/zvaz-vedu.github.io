{{/* This part is for your custom CSS */}}
{{ define "styles" }}
    <link rel="stylesheet" href="/css/linktree.css">
    <style>
        /* --- Live Event Card Styles --- */
        #live-event-container {
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        .current-event-card {
            background: #ffffff;
            border-left: 5px solid #e74c3c; /* Red accent for "Live" */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .live-indicator {
            background-color: #e74c3c;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Pulsing dot animation */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
        }

        .event-time {
            font-family: monospace;
            font-size: 0.9rem;
            color: #666;
            font-weight: 600;
        }

        .event-details {
            font-size: 1.2rem;
            line-height: 1.4;
            color: #2c3e50;
            font-weight: bold;
        }

        /* Styling for the <small> tags coming from YAML */
        .event-details small {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            font-weight: normal;
            color: #555;
            font-style: italic;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
{{ end }}

{{ define "main" }}
    {{ if .Params.heading }}
    <h1>{{ .Params.title }}</h1>
    {{ end }}

    <!--  ŠPATNÝ LIVE PROGRAM, ALE JINAK JE TO FUNKČÍ - HOTFIX COMMENT PŘI ZV! BRNO
    {{/* --- LIVE EVENT SECTION (JavaScript) --- */}}
    {{ if .Params.live }}
    <div id="live-event-container" style="display: none;">
        <div class="current-event-card">
            <div class="card-header">
                <div class="live-indicator">
                    <span class="live-dot"></span> LIVE
                </div>
                <span id="live-time" class="event-time"></span>
            </div>
            <div id="live-desc" class="event-details"></div>
        </div>
    </div>


    {{/* Dump the YAML data into a hidden variable for JS to read */}}
    <script>
        const scheduleData = {{ .Site.Data.program.schedule | jsonify | safeJS }};

        function updateLiveEvent() {
            const now = new Date();
            // Convert current time to simple minutes for easy math
            const currentMinutes = (now.getHours() * 60) + now.getMinutes();

            const container = document.getElementById('live-event-container');
            const timeLabel = document.getElementById('live-time');
            const descLabel = document.getElementById('live-desc');
            
            let activeEvent = null;

            scheduleData.forEach(item => {
                // Parse start time (e.g. "09:00")
                const [startH, startM] = item.start.split(':').map(Number);
                const startTotal = (startH * 60) + startM;

                // Parse end time
                const [endH, endM] = item.end.split(':').map(Number);
                const endTotal = (endH * 60) + endM;

                // Check if now is between start and end
                if (currentMinutes >= startTotal && currentMinutes < endTotal) {
                    activeEvent = item;
                }
            });

            if (activeEvent) {
                container.style.display = 'block';
                timeLabel.innerText = activeEvent.time_label;
                // Using innerHTML to render the <br> and <small> tags from YAML
                descLabel.innerHTML = activeEvent.event;
            } else {
                container.style.display = 'none';
            }
        }

        // Run on load and check every 30 seconds
        document.addEventListener("DOMContentLoaded", function() {
            updateLiveEvent();
            setInterval(updateLiveEvent, 30000); 
        });
    </script>
    {{ end }}
    {{/* --- END LIVE EVENT SECTION --- */}}

{{ end }}

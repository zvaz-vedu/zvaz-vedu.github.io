{{define "styles"}}
    <link rel="stylesheet" href="/css/single.css">
    <link rel="stylesheet" href="/css/abstract.css">
    <link rel="stylesheet" href="/css/base.css">
{{end}}
{{define "scripts"}}

{{end}}

{{define "main"}}
    <header class="layout-container">
        <div class="layout-content">
            <div class="header-body">
                <h1>{{.Params.headerTitle}}</h1>
                <p class="header-text">{{.Params.headerText}}</p>
            </div>
            <picture>
                <source srcset="/media/imgs/base/zv_kocka_45deg_zv-white.webp" media="(prefers-color-scheme: dark)">
                <img class="mark-img" src="/media/imgs/base/zv_kocka_45deg_zv-black.webp" alt="">
            </picture>

        </div>
    </header>
    <div class="layout-container" id="content">
        <div class="layout-content" style="padding:0">
            {{/* Zde se vloží obsah markdown souboru včetně shortcodů */}}
            {{.Content}}
        </div>
    </div>
{{end}}

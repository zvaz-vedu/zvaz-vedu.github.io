{{ $speakerId := .Get "name" | urlize}}

<div class="speaker-container {{with .Get "class"}}{{.}}{{end}}" id="{{$speakerId}}" >
    <div class="speaker-photo-container">
        <img class="speaker-photo" src="/media/imgs/speakers/{{ replace (.Get "photo") ".webp" "-sm.webp" }}" srcset="/media/imgs/speakers/{{ replace (.Get "photo") ".webp" "-sm.webp" }} 600w, /media/imgs/speakers/{{ replace (.Get "photo") ".webp" "-md.webp" }} 1200w, /media/imgs/speakers/{{ replace (.Get "photo") ".webp" "-hd.webp" }} 1920w" sizes="300px">
    </div>
    <div class="speaker-body">
        <h4 class="speaker-name">{{.Get "name"}}</h4>
        <p class="speaker-text">{{.Get "info"}}</p>
    </div>
</div>
